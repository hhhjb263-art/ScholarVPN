<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>登录 · ScholarVPN 后台管理</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--line:#262c38;--txt:#e6e9ef;--dim:#8b94a6;
        --acc:#4b8bf5;--err:#f85149;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(900px 500px at 50% -10%,#1a2333,#0f1115);
       color:var(--txt);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
  .card{width:min(400px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);
        border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--dim);font-size:12px;margin:12px 0 4px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
        padding:10px 12px;color:var(--txt);font:14px ui-monospace,Menlo,monospace;outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;
         background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--err);white-space:pre-wrap}
  .msg.ok{color:var(--ok)}
  .hint{color:var(--dim);font-size:12px;margin-top:14px;text-align:center}
  .hint code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--txt);
             word-break:break-all;display:inline-block;margin-top:6px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="card">
  <h1>ScholarVPN 后台管理</h1>
  <p class="sub">管理员登录</p>
  <form id="form" autocomplete="on">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" maxlength="32" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button id="btn" type="submit">登录</button>
  </form>
  <div id="msg" class="msg"></div>
  <p id="noAdmin" class="hint hidden">
    尚未创建管理员。请服务器管理员执行：<br>
    <code>cd /root/ScholarVPN/tools/webadmin &amp;&amp; python3 manage.py create-admin &lt;用户名&gt;</code>
  </p>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function show(text, ok) {
  const m = $("msg");
  m.textContent = text || "";
  m.className = "msg" + (ok ? " ok" : "");
}
const query = new URLSearchParams(location.search);
if (query.get("changed") === "1") show("密码已修改，请用新密码登录", true);
(async () => {
  try {
    const r = await fetch("/api/auth/status", { headers: { "Accept": "application/json" } });
    const j = await r.json();
    if (j && j.initialized === false) $("noAdmin").classList.remove("hidden");
  } catch (_) { /* 忽略：登录仍可尝试 */ }
})();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) { show("请输入用户名和密码"); return; }
  const btn = $("btn");
  btn.disabled = true;
  show("");
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    if (r.status === 429) show("尝试次数过多，请稍后再试");
    else show((j.error || "登录失败") + (j.hint ? "：" + j.hint : ""));
  } catch (err) {
    show("网络错误，请检查连接");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
