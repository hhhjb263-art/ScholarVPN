<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>初始化管理员 · ScholarVPN 后台管理</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--line:#262c38;--txt:#e6e9ef;--dim:#8b94a6;
        --acc:#4b8bf5;--err:#f85149;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(900px 500px at 50% -10%,#1a2333,#0f1115);
       color:var(--txt);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
  .card{width:min(430px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);
        border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--dim);font-size:12px;margin:12px 0 4px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
        padding:10px 12px;color:var(--txt);font:14px ui-monospace,Menlo,monospace;outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;
         background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--err);white-space:pre-wrap}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .hint a{color:var(--acc);text-decoration:none}
  .hidden{display:none!important}
  .closed{color:var(--txt);padding:8px 0}
</style>
</head>
<body>
<div class="card">
  <h1>初始化管理员</h1>
  <p class="sub">仅在系统还没有任何管理员时可用</p>

  <div id="closed" class="closed hidden">
    管理员已初始化，注册已关闭。<br>
    <a href="/login">返回登录</a>
  </div>

  <form id="form" autocomplete="on">
    <label for="username">用户名（3–32 位字母/数字/._-）</label>
    <input id="username" name="username" autocomplete="username" maxlength="32" required autofocus>
    <label for="password">密码（至少 10 位）</label>
    <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
    <label for="password2">确认密码</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="128" required>
    <label for="bootstrap">初始化令牌（中转管理令牌）</label>
    <input id="bootstrap" name="bootstrap" type="password" autocomplete="off" maxlength="256" required>
    <p class="hint">在服务器执行 <code>cd /root/ScholarVPN/server &amp;&amp; ./admin-relay.sh token</code> 获取。</p>
    <button id="btn" type="submit">创建管理员并登录</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function show(text) { $("msg").textContent = text || ""; }
(async () => {
  try {
    const r = await fetch("/api/auth/status", { headers: { "Accept": "application/json" } });
    const j = await r.json();
    if (j && j.initialized) {
      $("closed").classList.remove("hidden");
      $("form").classList.add("hidden");
    }
  } catch (_) { /* 忽略 */ }
})();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  const password2 = $("password2").value;
  const bootstrap_token = $("bootstrap").value;
  if (password !== password2) { show("两次输入的密码不一致"); return; }
  if (password.length < 10) { show("密码至少 10 位"); return; }
  const btn = $("btn");
  btn.disabled = true;
  show("");
  try {
    const r = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ username, password, bootstrap_token }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    if (r.status === 429) show("尝试次数过多，请稍后再试");
    else show((j.error || "创建失败") + (j.hint ? "：" + j.hint : ""));
  } catch (err) {
    show("网络错误，请检查连接");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
