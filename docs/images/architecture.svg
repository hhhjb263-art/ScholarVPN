<svg width="100%" viewBox="0 0 680 346" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ScholarVPN 架构与认证流程</title>
  <desc>客户端与服务端通过 UDP/TCP 双传输建立隧道：客户端 TUN 封装后经互联网送达服务端会话表，服务端 TUN 转发至外网；认证分服务器签名校验、客户端准入、会话密钥三个阶段。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t{font:400 13px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2937}
    .ts{font:400 12px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#6b7280}
    .th{font:500 14px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#0c447c}
  </style>

  <rect x="40" y="56" width="210" height="196" rx="14" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="th" x="52" y="78">客户端 · Windows / Linux</text>
  <rect x="56" y="92" width="178" height="36" rx="8" fill="#ffffff" stroke="#85b7eb" stroke-width="0.5"/>
  <text class="t" x="145" y="110" text-anchor="middle" dominant-baseline="central">Qt 界面 + 业务逻辑</text>
  <rect x="56" y="138" width="178" height="36" rx="8" fill="#ffffff" stroke="#85b7eb" stroke-width="0.5"/>
  <text class="t" x="145" y="156" text-anchor="middle" dominant-baseline="central">TUN 虚拟网卡</text>
  <rect x="56" y="184" width="178" height="36" rx="8" fill="#ffffff" stroke="#85b7eb" stroke-width="0.5"/>
  <text class="t" x="145" y="202" text-anchor="middle" dominant-baseline="central">UDP / TCP + AES-256-GCM</text>

  <ellipse cx="340" cy="154" rx="48" ry="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text class="t" x="340" y="149" text-anchor="middle" dominant-baseline="central">互联网</text>
  <text class="ts" x="340" y="167" text-anchor="middle" dominant-baseline="central">同端口双栈</text>

  <rect x="430" y="56" width="210" height="196" rx="14" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text class="th" x="442" y="78">服务端 · Linux</text>
  <rect x="446" y="92" width="178" height="36" rx="8" fill="#ffffff" stroke="#85b7eb" stroke-width="0.5"/>
  <text class="t" x="535" y="110" text-anchor="middle" dominant-baseline="central">UDP 会话表</text>
  <rect x="446" y="138" width="178" height="36" rx="8" fill="#ffffff" stroke="#85b7eb" stroke-width="0.5"/>
  <text class="t" x="535" y="156" text-anchor="middle" dominant-baseline="central">TCP epoll 单线程</text>
  <rect x="446" y="184" width="178" height="36" rx="8" fill="#ffffff" stroke="#85b7eb" stroke-width="0.5"/>
  <text class="t" x="535" y="202" text-anchor="middle" dominant-baseline="central">TUN → NAT → 外网</text>

  <path d="M254 112 L420 112" fill="none" stroke="#185fa5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="337" y="102" text-anchor="middle">上行 · 封装</text>
  <path d="M420 196 L254 196" fill="none" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="337" y="214" text-anchor="middle">下行 · 解封装</text>

  <rect x="40" y="282" width="170" height="44" rx="8" fill="#ffffff" stroke="#378add" stroke-width="0.5"/>
  <text class="t" x="125" y="304" text-anchor="middle" dominant-baseline="central">① 服务器签名校验</text>
  <path d="M210 304 L250 304" fill="none" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="252" y="282" width="170" height="44" rx="8" fill="#ffffff" stroke="#378add" stroke-width="0.5"/>
  <text class="t" x="337" y="304" text-anchor="middle" dominant-baseline="central">② 客户端准入</text>
  <path d="M422 304 L462 304" fill="none" stroke="#378add" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="464" y="282" width="176" height="44" rx="8" fill="#ffffff" stroke="#378add" stroke-width="0.5"/>
  <text class="t" x="552" y="304" text-anchor="middle" dominant-baseline="central">③ 会话密钥 · 建隧道</text>
</svg>
